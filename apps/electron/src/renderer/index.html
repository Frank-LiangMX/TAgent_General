<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAgent</title>
    <script>
      // 主题 + 材质初始化（React 加载前，避免闪高透 / 闪主题）
      // 主题：localStorage 缓存；材质：默认 frosted（高级材质关），与 ADR-0005 对齐
      ;(function() {
        var mode = localStorage.getItem('tagent-theme-mode') || 'light'
        var style = localStorage.getItem('tagent-theme-style')
        var material = localStorage.getItem('tagent-material-mode') || 'frosted'
        var html = document.documentElement

        if (mode === 'special' && style && style !== 'default') {
          // 特殊风格模式：添加主题类名 + 根据后缀决定 dark 类
          html.classList.add('theme-' + style)
          if (style.endsWith('-dark')) {
            html.classList.add('dark')
          }
        } else if (mode === 'dark') {
          html.classList.add('dark')
        } else if (mode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark')
          }
        }
        // mode === 'light' 时不添加 dark 类

        // 材质轴：唯一权威 data-material；material-frosted class 仅兼容旧选择器
        if (material !== 'glass' && material !== 'soft' && material !== 'frosted') {
          material = 'frosted'
        }
        html.setAttribute('data-material', material)
        if (material === 'frosted') {
          html.classList.add('material-frosted')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
