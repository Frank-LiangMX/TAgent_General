<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist" data-mode="light" data-material="soft">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAgent — 看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../themes.css" />
  <link rel="stylesheet" href="../tagent.css" />
  <link rel="stylesheet" href="../materials.css" />
  <link rel="stylesheet" href="../components/shared.css" />
  <style>
    .kanban-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
    }

    .kanban-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .kanban-board-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kanban-board-select {
      padding: 8px 12px;
      border-radius: var(--r-md);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .kanban-board-stats {
      display: flex;
      gap: 16px;
    }

    .kanban-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-faint);
    }

    .kanban-stat-value {
      font-weight: 600;
      color: var(--text);
    }

    .kanban-columns {
      display: flex;
      gap: 16px;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 16px;
    }

    .kanban-column {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .kanban-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--r-md) var(--r-md) 0 0;
      background: var(--glass-soft);
      border: 1px solid var(--rim);
      border-bottom: none;
    }

    .kanban-column-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .kanban-column-count {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--glass-strong);
      font-size: 11px;
      color: var(--text-faint);
    }

    .kanban-column-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      border-radius: 0 0 var(--r-md) var(--r-md);
      background: var(--glass-well);
      border: 1px solid var(--rim);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kanban-task {
      padding: 14px;
      border-radius: var(--r-md);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .kanban-task:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--ambient-shadow);
    }

    .kanban-task-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .kanban-task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-faint);
    }

    .kanban-task-priority {
      padding: 2px 6px;
      border-radius: var(--r-xs);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .kanban-task-role {
      padding: 2px 6px;
      border-radius: var(--r-xs);
      background: var(--glass-soft);
      border: 1px solid var(--rim-soft);
    }

    .kanban-task-status.running {
      border-left: 3px solid var(--accent);
    }

    .kanban-task-status.done {
      border-left: 3px solid var(--success);
    }

    .kanban-task-status.blocked,
    .kanban-task-status.failed {
      border-left: 3px solid var(--danger);
    }

    /* 任务详情模态框 */
    .task-detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .task-detail-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    .task-detail-status.pending { background: var(--glass-soft); color: var(--text-faint); }
    .task-detail-status.ready { background: rgba(91, 127, 212, 0.12); color: var(--accent); }
    .task-detail-status.running { background: rgba(91, 127, 212, 0.18); color: var(--accent); }
    .task-detail-status.done { background: rgba(63, 154, 106, 0.12); color: var(--success); }
    .task-detail-status.failed { background: rgba(196, 91, 91, 0.12); color: var(--danger); }

    .task-detail-body {
      padding: 14px;
      border-radius: var(--r-md);
      background: var(--glass-soft);
      border: 1px solid var(--rim-soft);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-soft);
      white-space: pre-wrap;
    }

    /* 状态列颜色 */
    .column-pending .kanban-column-header { border-left: 3px solid var(--text-faint); }
    .column-ready .kanban-column-header { border-left: 3px solid var(--accent); }
    .column-running .kanban-column-header { border-left: 3px solid #3b82f6; }
    .column-done .kanban-column-header { border-left: 3px solid var(--success); }
    .column-failed .kanban-column-header { border-left: 3px solid var(--danger); }
  </style>
</head>
<body>
  <!-- 主题切换器 -->
  <div class="theme-dock" role="region" aria-label="主题与材质">
    <div class="theme-dock-row">
      <div class="theme-swatches">
        <button type="button" class="theme-swatch is-active" data-pick="mist" title="云絮"></button>
        <button type="button" class="theme-swatch" data-pick="ocean" title="碧海"></button>
        <button type="button" class="theme-swatch" data-pick="moss" title="青苔"></button>
        <button type="button" class="theme-swatch" data-pick="dusk" title="暮霭"></button>
      </div>
      <span class="theme-name" id="themeName">云絮 · 浅色 · 轻拟态</span>
    </div>
    <div class="theme-dock-row">
      <div class="seg glass-seg material-seg">
        <button type="button" class="is-active" data-material="soft">轻拟态</button>
        <button type="button" data-material="liquid">液态玻璃</button>
      </div>
      <div class="seg glass-seg">
        <button type="button" class="is-active" data-mode="light">浅色</button>
        <button type="button" data-mode="dark">深色</button>
      </div>
    </div>
  </div>

  <div class="desktop" aria-hidden="true">
    <div class="wallpaper"></div>
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>
    <div class="wash wash-c"></div>
  </div>

  <div class="shell-scene">
    <!-- 左侧导航 -->
    <div class="overlay-left">
      <aside class="nav-island glass-island" style="width:var(--rail-width);">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
        <nav class="nav-rail" style="width:100%;border-right:none;">
          <a href="../index.html" class="rail-btn" title="工作台">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="chat.html" class="rail-btn" title="会话">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v6A2.5 2.5 0 0 1 16.5 16H10l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 13.5v-6Z" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <button type="button" class="rail-btn is-active" title="看板">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <a href="draft.html" class="rail-btn" title="草稿">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 19V8.5a1 1 0 0 1 1-1h5.5L18 12v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 7.5V12H18" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="memory.html" class="rail-btn" title="记忆">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 8.5A3.5 3.5 0 0 1 9.5 5h5A3.5 3.5 0 0 1 18 8.5v7A3.5 3.5 0 0 1 14.5 19h-5A3.5 3.5 0 0 1 6 15.5v-7Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 9.5h6M9 12.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
          <div class="rail-spacer"></div>
          <a href="settings.html" class="rail-btn" title="设置">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
        </nav>
      </aside>
    </div>

    <!-- 主内容区 -->
    <div class="content-scene">
      <div class="content-base-plate" aria-hidden="true">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
      </div>

      <div class="content-foreground">
        <div class="content-body" style="padding:20px;">
          <div class="kanban-layout">
            <div class="kanban-header">
              <div class="kanban-board-selector">
                <select class="kanban-board-select" id="boardSelect"></select>
                <div class="kanban-board-stats" id="boardStats"></div>
              </div>
              <div style="display:flex;gap:8px;">
                <button type="button" class="btn-secondary" id="newBoardBtn">新建看板</button>
                <button type="button" class="btn-primary" id="newTaskBtn">添加任务</button>
              </div>
            </div>

            <div class="kanban-columns" id="kanbanColumns">
              <!-- 由 JS 渲染 -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 任务详情模态框 -->
  <div class="modal-overlay" id="taskDetailModal">
    <div class="modal-content" style="max-width:520px;">
      <div class="modal-header">
        <div>
          <span class="task-detail-status" id="taskDetailStatus">pending</span>
        </div>
        <button type="button" class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body">
        <h3 style="margin:0 0 12px;font-size:16px;" id="taskDetailTitle">任务标题</h3>
        <div class="task-detail-body" id="taskDetailBody">任务描述...</div>
        <div style="margin-top:16px;display:flex;gap:12px;">
          <div class="form-group" style="flex:1;">
            <label class="form-label">优先级</label>
            <div id="taskDetailPriority" style="font-size:14px;font-weight:600;color:var(--text);">10</div>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">角色</label>
            <div id="taskDetailRole" style="font-size:14px;color:var(--text-soft);">-</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="taskCancelBtn">取消任务</button>
        <button type="button" class="btn-primary" id="taskRunBtn">立即执行</button>
      </div>
    </div>
  </div>

  <script src="../mock/data.js"></script>
  <script src="../components/shared.js"></script>
  <script>
    (() => {
      const state = {
        boards: [],
        tasks: [],
        currentBoardId: null
      };

      const COLUMNS = [
        { status: 'pending', label: '待办', icon: '⏳' },
        { status: 'ready', label: '可领取', icon: '📋' },
        { status: 'running', label: '执行中', icon: '🔄' },
        { status: 'done', label: '完成', icon: '✅' },
        { status: 'failed', label: '失败', icon: '❌' }
      ];

      function renderBoardSelect() {
        const select = document.getElementById('boardSelect');
        select.innerHTML = state.boards.map(b =>
          `<option value="${b.id}">${b.title}</option>`
        ).join('');
        if (!state.currentBoardId && state.boards.length > 0) {
          state.currentBoardId = state.boards[0].id;
        }
        select.value = state.currentBoardId;
      }

      function renderBoardStats() {
        const board = state.boards.find(b => b.id === state.currentBoardId);
        const container = document.getElementById('boardStats');
        if (!board) { container.innerHTML = ''; return; }

        container.innerHTML = `
          <span class="kanban-stat">任务 <span class="kanban-stat-value">${board.taskCount}</span></span>
          <span class="kanban-stat">完成 <span class="kanban-stat-value">${board.completedCount}</span></span>
          <span class="kanban-stat">并发 <span class="kanban-stat-value">${board.maxConcurrent}</span></span>
        `;
      }

      function renderColumns() {
        const container = document.getElementById('kanbanColumns');
        const boardTasks = state.tasks.filter(t => t.boardId === state.currentBoardId);

        container.innerHTML = COLUMNS.map(col => {
          const columnTasks = boardTasks.filter(t => t.status === col.status);
          return `
            <div class="kanban-column column-${col.status}">
              <div class="kanban-column-header">
                <div class="kanban-column-title">
                  <span>${col.icon}</span>
                  <span>${col.label}</span>
                </div>
                <span class="kanban-column-count">${columnTasks.length}</span>
              </div>
              <div class="kanban-column-body">
                ${columnTasks.map(t => renderTask(t)).join('')}
              </div>
            </div>
          `;
        }).join('');

        bindTaskEvents();
      }

      function renderTask(task) {
        return `
          <div class="kanban-task kanban-task-status-${task.status}" data-task="${task.id}">
            <div class="kanban-task-title">${task.title}</div>
            <div class="kanban-task-meta">
              <span class="kanban-task-priority">P${task.priority}</span>
              ${task.roleId ? `<span class="kanban-task-role">${task.roleId}</span>` : ''}
              ${task.assigneeSessionId ? `<span>会话 ${task.assigneeSessionId}</span>` : ''}
            </div>
          </div>
        `;
      }

      function bindTaskEvents() {
        document.querySelectorAll('.kanban-task').forEach(el => {
          el.addEventListener('click', () => {
            const taskId = el.dataset.task;
            showTaskDetail(taskId);
          });
        });
      }

      function showTaskDetail(taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) return;

        document.getElementById('taskDetailStatus').textContent = task.status;
        document.getElementById('taskDetailStatus').className = `task-detail-status ${task.status}`;
        document.getElementById('taskDetailTitle').textContent = task.title;
        document.getElementById('taskDetailBody').textContent = task.body || '暂无详细描述';
        document.getElementById('taskDetailPriority').textContent = task.priority;
        document.getElementById('taskDetailRole').textContent = task.roleId || '-';

        Modal.open('taskDetailModal');
      }

      async function init() {
        state.boards = await api.getKanbanBoards();
        state.tasks = await api.getKanbanTasks();

        renderBoardSelect();
        renderBoardStats();
        renderColumns();

        document.getElementById('boardSelect').addEventListener('change', (e) => {
          state.currentBoardId = e.target.value;
          renderBoardStats();
          renderColumns();
        });

        document.getElementById('newTaskBtn').addEventListener('click', () => {
          Toast.info('新建任务功能开发中...');
        });

        document.getElementById('newBoardBtn').addEventListener('click', () => {
          Toast.info('新建看板功能开发中...');
        });

        document.getElementById('taskRunBtn').addEventListener('click', () => {
          Toast.success('任务已启动');
          Modal.close('taskDetailModal');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
