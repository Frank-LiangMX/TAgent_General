<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist" data-mode="light" data-material="soft">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAgent — 草稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../themes.css" />
  <link rel="stylesheet" href="../tagent.css" />
  <link rel="stylesheet" href="../materials.css" />
  <link rel="stylesheet" href="../components/shared.css" />
  <style>
    .draft-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      height: calc(100vh - 140px);
    }

    .draft-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .draft-item {
      padding: 14px;
      border-radius: var(--r-md);
      background: var(--glass-soft);
      border: 1px solid transparent;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .draft-item:hover {
      background: var(--glass-strong);
    }

    .draft-item.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .draft-item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .draft-item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .draft-item-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--glass-strong);
      color: var(--text-faint);
      flex-shrink: 0;
    }

    .draft-item-status.ready { background: var(--accent-soft); color: var(--accent); }
    .draft-item-status.executing { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }

    .draft-item-meta {
      font-size: 11px;
      color: var(--text-faint);
    }

    .draft-detail {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .draft-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .draft-detail-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .draft-context {
      padding: 16px;
      border-radius: var(--r-lg);
      background: var(--glass-soft);
      border: 1px solid var(--rim-soft);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-soft);
    }

    .requirements-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .requirement-block {
      padding: 16px;
      border-radius: var(--r-lg);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
    }

    .requirement-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .requirement-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
    }

    .requirement-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .requirement-desc {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 12px;
    }

    .acceptance-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .acceptance-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--r-sm);
      background: var(--glass-soft);
    }

    .acceptance-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--rim);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .acceptance-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .acceptance-checkbox.checked::after {
      content: '✓';
      color: #fff;
      font-size: 10px;
    }

    .acceptance-text {
      font-size: 12px;
      color: var(--text);
    }

    .acceptance-text.completed {
      color: var(--text-faint);
      text-decoration: line-through;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-faint);
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="theme-dock" role="region" aria-label="主题与材质">
    <div class="theme-dock-row">
      <div class="theme-swatches">
        <button type="button" class="theme-swatch is-active" data-pick="mist"></button>
        <button type="button" class="theme-swatch" data-pick="ocean"></button>
        <button type="button" class="theme-swatch" data-pick="moss"></button>
        <button type="button" class="theme-swatch" data-pick="dusk"></button>
      </div>
      <span class="theme-name" id="themeName">云絮 · 浅色 · 轻拟态</span>
    </div>
    <div class="theme-dock-row">
      <div class="seg glass-seg material-seg">
        <button type="button" class="is-active" data-material="soft">轻拟态</button>
        <button type="button" data-material="liquid">液态玻璃</button>
      </div>
      <div class="seg glass-seg">
        <button type="button" class="is-active" data-mode="light">浅色</button>
        <button type="button" data-mode="dark">深色</button>
      </div>
    </div>
  </div>

  <div class="desktop" aria-hidden="true">
    <div class="wallpaper"></div>
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>
    <div class="wash wash-c"></div>
  </div>

  <div class="shell-scene">
    <div class="overlay-left">
      <aside class="nav-island glass-island" style="width:var(--rail-width);">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
        <nav class="nav-rail" style="width:100%;border-right:none;">
          <a href="../index.html" class="rail-btn" title="工作台">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="chat.html" class="rail-btn" title="会话">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v6A2.5 2.5 0 0 1 16.5 16H10l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 13.5v-6Z" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="kanban.html" class="rail-btn" title="看板">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <button type="button" class="rail-btn is-active" title="草稿">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 19V8.5a1 1 0 0 1 1-1h5.5L18 12v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 7.5V12H18" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <a href="memory.html" class="rail-btn" title="记忆">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 8.5A3.5 3.5 0 0 1 9.5 5h5A3.5 3.5 0 0 1 18 8.5v7A3.5 3.5 0 0 1 14.5 19h-5A3.5 3.5 0 0 1 6 15.5v-7Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 9.5h6M9 12.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
          <div class="rail-spacer"></div>
          <a href="settings.html" class="rail-btn" title="设置">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
        </nav>
      </aside>
    </div>

    <div class="content-scene">
      <div class="content-base-plate" aria-hidden="true">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
      </div>

      <div class="content-foreground">
        <div class="content-body" style="padding:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
            <h1 style="margin:0;font-size:18px;font-weight:600;color:var(--text);">草稿</h1>
            <button type="button" class="btn-primary" id="newDraftBtn">新建草稿</button>
          </div>

          <div class="draft-layout">
            <div class="draft-list" id="draftList">
              <!-- 由 JS 渲染 -->
            </div>
            <div class="draft-detail" id="draftDetail">
              <div class="empty-state">
                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none">
                  <path d="M7 19V8.5a1 1 0 0 1 1-1h5.5L18 12v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M13.5 7.5V12H18" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <div class="empty-state-title">选择或新建草稿</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../mock/data.js"></script>
  <script src="../components/shared.js"></script>
  <script>
    (() => {
      const state = {
        drafts: [],
        currentDraftId: null
      };

      function renderList() {
        const container = document.getElementById('draftList');
        container.innerHTML = state.drafts.map(d => `
          <div class="draft-item ${d.id === state.currentDraftId ? 'is-active' : ''}" data-draft="${d.id}">
            <div class="draft-item-header">
              <div class="draft-item-title">${d.title}</div>
              <span class="draft-item-status ${d.status}">${getStatusText(d.status)}</span>
            </div>
            <div class="draft-item-meta">${d.requirements.length} 个需求块 · ${formatTime(d.updatedAt)}</div>
          </div>
        `).join('');

        container.querySelectorAll('.draft-item').forEach(el => {
          el.addEventListener('click', () => {
            state.currentDraftId = el.dataset.draft;
            renderList();
            renderDetail();
          });
        });
      }

      function renderDetail() {
        const container = document.getElementById('draftDetail');
        const draft = state.drafts.find(d => d.id === state.currentDraftId);

        if (!draft) {
          container.innerHTML = `
            <div class="empty-state">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none">
                <path d="M7 19V8.5a1 1 0 0 1 1-1h5.5L18 12v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <div class="empty-state-title">选择草稿查看详情</div>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="draft-detail-header">
            <h2 class="draft-detail-title">${draft.title}</h2>
            <div style="display:flex;gap:8px;">
              <button type="button" class="btn-secondary" id="editDraftBtn">编辑</button>
              <button type="button" class="btn-primary" id="upgradeDraftBtn">升级为会话</button>
            </div>
          </div>

          <div>
            <h3 style="font-size:13px;font-weight:500;color:var(--text-soft);margin-bottom:8px;">背景</h3>
            <div class="draft-context">${draft.context}</div>
          </div>

          <div>
            <h3 style="font-size:13px;font-weight:500;color:var(--text-soft);margin-bottom:8px;">需求块</h3>
            <div class="requirements-list">
              ${draft.requirements.map(r => `
                <div class="requirement-block">
                  <div class="requirement-header">
                    <span class="requirement-label">${r.label}</span>
                  </div>
                  <div class="requirement-title">${r.title}</div>
                  <div class="requirement-desc">${r.description}</div>
                  <div class="acceptance-list">
                    ${r.acceptanceCriteria.map(ac => `
                      <div class="acceptance-item">
                        <div class="acceptance-checkbox ${ac.checked ? 'checked' : ''}" data-ac="${ac.id}"></div>
                        <span class="acceptance-text ${ac.checked ? 'completed' : ''}">${ac.text}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <button type="button" class="btn-secondary" id="addRequirementBtn" style="width:100%;">+ 添加需求块</button>
        `;

        document.getElementById('upgradeDraftBtn')?.addEventListener('click', () => {
          Toast.success('草稿已升级为会话');
        });

        document.getElementById('addRequirementBtn')?.addEventListener('click', () => {
          Toast.info('添加需求块功能开发中...');
        });
      }

      function getStatusText(status) {
        const map = { draft: '草稿', ready: '就绪', executing: '执行中', done: '完成', verified: '已验证' };
        return map[status] || status;
      }

      function formatTime(ts) {
        const diff = Date.now() - ts;
        const hours = Math.floor(diff / 3600000);
        if (hours < 1) return '刚刚';
        if (hours < 24) return `${hours}小时前`;
        const days = Math.floor(hours / 24);
        return `${days}天前`;
      }

      async function init() {
        state.drafts = await api.getDrafts();
        renderList();

        if (state.drafts.length > 0) {
          state.currentDraftId = state.drafts[0].id;
          renderList();
          renderDetail();
        }

        document.getElementById('newDraftBtn').addEventListener('click', () => {
          Toast.info('新建草稿功能开发中...');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
