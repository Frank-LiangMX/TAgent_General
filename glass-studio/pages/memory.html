<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist" data-mode="light" data-material="soft">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAgent — 记忆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../themes.css" />
  <link rel="stylesheet" href="../tagent.css" />
  <link rel="stylesheet" href="../materials.css" />
  <link rel="stylesheet" href="../components/shared.css" />
  <style>
    .memory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 16px;
    }

    .memory-search {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .memory-search-input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border-radius: var(--r-md);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
      color: var(--text);
      font-size: 13px;
    }

    .memory-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
    }

    .memory-filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .memory-card {
      padding: 16px;
      border-radius: var(--r-lg);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
      transition: transform 150ms ease, box-shadow 150ms ease;
      cursor: pointer;
    }

    .memory-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--ambient-shadow);
    }

    .memory-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .memory-key {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      word-break: break-all;
    }

    .memory-type {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      background: var(--glass-soft);
      border: 1px solid var(--rim-soft);
      color: var(--text-faint);
      flex-shrink: 0;
    }

    .memory-type.preference { background: rgba(91, 127, 212, 0.12); color: var(--accent); }
    .memory-type.fact { background: rgba(63, 154, 106, 0.12); color: var(--success); }
    .memory-type.note { background: rgba(160, 122, 94, 0.12); color: #a07a5e; }

    .memory-value {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 12px;
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .memory-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-faint);
    }

    .memory-category {
      padding: 2px 8px;
      border-radius: var(--r-xs);
      background: var(--glass-soft);
    }

    .memory-source {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .memory-source.learned {
      color: var(--accent);
    }

    .memory-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .memory-stat-card {
      padding: 16px;
      border-radius: var(--r-lg);
      background: var(--glass-strong);
      border: 1px solid var(--rim);
      text-align: center;
    }

    .memory-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .memory-stat-label {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="theme-dock" role="region" aria-label="主题与材质">
    <div class="theme-dock-row">
      <div class="theme-swatches">
        <button type="button" class="theme-swatch is-active" data-pick="mist"></button>
        <button type="button" class="theme-swatch" data-pick="ocean"></button>
        <button type="button" class="theme-swatch" data-pick="moss"></button>
        <button type="button" class="theme-swatch" data-pick="dusk"></button>
      </div>
      <span class="theme-name" id="themeName">云絮 · 浅色 · 轻拟态</span>
    </div>
    <div class="theme-dock-row">
      <div class="seg glass-seg material-seg">
        <button type="button" class="is-active" data-material="soft">轻拟态</button>
        <button type="button" data-material="liquid">液态玻璃</button>
      </div>
      <div class="seg glass-seg">
        <button type="button" class="is-active" data-mode="light">浅色</button>
        <button type="button" data-mode="dark">深色</button>
      </div>
    </div>
  </div>

  <div class="desktop" aria-hidden="true">
    <div class="wallpaper"></div>
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>
    <div class="wash wash-c"></div>
  </div>

  <div class="shell-scene">
    <div class="overlay-left">
      <aside class="nav-island glass-island" style="width:var(--rail-width);">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
        <nav class="nav-rail" style="width:100%;border-right:none;">
          <a href="../index.html" class="rail-btn" title="工作台">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="chat.html" class="rail-btn" title="会话">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v6A2.5 2.5 0 0 1 16.5 16H10l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 13.5v-6Z" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="kanban.html" class="rail-btn" title="看板">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="5" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="5" width="5" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="17" y="5" width="3" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <a href="draft.html" class="rail-btn" title="草稿">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 19V8.5a1 1 0 0 1 1-1h5.5L18 12v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 7.5V12H18" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
          <button type="button" class="rail-btn is-active" title="记忆">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 8.5A3.5 3.5 0 0 1 9.5 5h5A3.5 3.5 0 0 1 18 8.5v7A3.5 3.5 0 0 1 14.5 19h-5A3.5 3.5 0 0 1 6 15.5v-7Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 9.5h6M9 12.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="rail-spacer"></div>
          <a href="settings.html" class="rail-btn" title="设置">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
        </nav>
      </aside>
    </div>

    <div class="content-scene">
      <div class="content-base-plate" aria-hidden="true">
        <div class="specular"></div>
        <div class="chroma-edge"></div>
      </div>

      <div class="content-foreground">
        <div class="content-body" style="padding:20px;">
          <h1 style="margin:0 0 20px;font-size:18px;font-weight:600;color:var(--text);">记忆</h1>

          <div class="memory-stats" id="memoryStats">
            <!-- 由 JS 渲染 -->
          </div>

          <div class="memory-header">
            <div class="memory-search">
              <svg class="memory-search-icon" viewBox="0 0 24 24" fill="none" width="16" height="16">
                <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.5"/>
                <path d="M16 16l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input type="text" class="memory-search-input" id="searchInput" placeholder="搜索记忆键或值...">
            </div>
            <div style="display:flex;gap:8px;">
              <select class="form-input" id="categoryFilter" style="width:120px;padding:8px 12px;">
                <option value="">所有分类</option>
                <option value="UI">UI</option>
                <option value="项目">项目</option>
                <option value="工具">工具</option>
                <option value="代码风格">代码风格</option>
                <option value="会议">会议</option>
              </select>
              <button type="button" class="btn-primary" id="newMemoryBtn">添加记忆</button>
            </div>
          </div>

          <div class="memory-grid" id="memoryGrid">
            <!-- 由 JS 渲染 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加记忆模态框 -->
  <div class="modal-overlay" id="newMemoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">添加记忆</h3>
        <button type="button" class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">键 (Key)</label>
          <input type="text" class="form-input" id="memoryKey" placeholder="例如：user.preference.theme">
        </div>
        <div class="form-group">
          <label class="form-label">值 (Value)</label>
          <textarea class="form-input form-textarea" id="memoryValue" placeholder="记忆值..."></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label class="form-label">类型</label>
            <select class="form-input" id="memoryType">
              <option value="preference">偏好</option>
              <option value="fact">事实</option>
              <option value="note">笔记</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">分类</label>
            <input type="text" class="form-input" id="memoryCategory" placeholder="例如：UI">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <input type="text" class="form-input" id="memoryDesc" placeholder="简要描述这条记忆">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-modal-close>取消</button>
        <button type="button" class="btn-primary" id="saveMemoryBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="../mock/data.js"></script>
  <script src="../components/shared.js"></script>
  <script>
    (() => {
      const state = {
        memories: [],
        filter: { category: '', search: '' }
      };

      function renderStats() {
        const container = document.getElementById('memoryStats');
        const stats = {
          total: state.memories.length,
          learned: state.memories.filter(m => m.source === 'learned').length,
          manual: state.memories.filter(m => m.source === 'manual').length,
          categories: new Set(state.memories.map(m => m.category)).size
        };

        container.innerHTML = `
          <div class="memory-stat-card">
            <div class="memory-stat-value">${stats.total}</div>
            <div class="memory-stat-label">总记忆数</div>
          </div>
          <div class="memory-stat-card">
            <div class="memory-stat-value">${stats.learned}</div>
            <div class="memory-stat-label">自动学习</div>
          </div>
          <div class="memory-stat-card">
            <div class="memory-stat-value">${stats.manual}</div>
            <div class="memory-stat-label">手动添加</div>
          </div>
          <div class="memory-stat-card">
            <div class="memory-stat-value">${stats.categories}</div>
            <div class="memory-stat-label">分类数</div>
          </div>
        `;
      }

      function renderGrid() {
        const container = document.getElementById('memoryGrid');
        let filtered = [...state.memories];

        if (state.filter.category) {
          filtered = filtered.filter(m => m.category === state.filter.category);
        }
        if (state.filter.search) {
          const search = state.filter.search.toLowerCase();
          filtered = filtered.filter(m =>
            m.key.toLowerCase().includes(search) ||
            m.value.toLowerCase().includes(search)
          );
        }

        container.innerHTML = filtered.map(m => `
          <div class="memory-card" data-memory="${m.id}">
            <div class="memory-card-header">
              <div class="memory-key">${m.key}</div>
              <span class="memory-type ${m.type}">${getTypeText(m.type)}</span>
            </div>
            <div class="memory-value">${m.value}</div>
            <div class="memory-card-footer">
              <span class="memory-category">${m.category}</span>
              <span class="memory-source ${m.source}">
                ${m.source === 'learned' ? '🤖 自动学习' : '✏️ 手动添加'}
              </span>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.memory-card').forEach(card => {
          card.addEventListener('click', () => {
            Toast.info('点击编辑记忆功能开发中...');
          });
        });
      }

      function getTypeText(type) {
        const map = { preference: '偏好', fact: '事实', note: '笔记' };
        return map[type] || type;
      }

      async function init() {
        state.memories = await api.getMemories();

        renderStats();
        renderGrid();

        // 搜索
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', Utils.debounce(() => {
          state.filter.search = searchInput.value;
          renderGrid();
        }, 300));

        // 分类筛选
        document.getElementById('categoryFilter').addEventListener('change', (e) => {
          state.filter.category = e.target.value;
          renderGrid();
        });

        // 新建记忆
        document.getElementById('newMemoryBtn').addEventListener('click', () => {
          Modal.open('newMemoryModal');
        });

        // 保存记忆
        document.getElementById('saveMemoryBtn').addEventListener('click', async () => {
          const key = document.getElementById('memoryKey').value.trim();
          const value = document.getElementById('memoryValue').value.trim();

          if (!key || !value) {
            Toast.warning('请填写键和值');
            return;
          }

          const newMemory = await api.createMemory({
            key,
            value,
            type: document.getElementById('memoryType').value,
            category: document.getElementById('memoryCategory').value || '其他',
            description: document.getElementById('memoryDesc').value
          });

          state.memories.unshift(newMemory);
          renderStats();
          renderGrid();
          Modal.close('newMemoryModal');
          Toast.success('记忆已保存');

          // 清空表单
          document.getElementById('memoryKey').value = '';
          document.getElementById('memoryValue').value = '';
          document.getElementById('memoryDesc').value = '';
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
